<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auditoría - Inspecciones AAA</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0B3D5C">
<style>
  :root{
    --navy:#0B3D5C; --teal-dark:#0E6E8C; --teal:#17A2B8; --success:#1F9D66; --success-bg:#E5F5EE;
    --warning:#F0A93A; --warning-bg:#FDF1DD; --danger:#E4572E; --danger-bg:#FCEAE3;
    --text:#142B3C; --text-2:#5C7182; --border:#DCE4E8; --card:#fff; --bg:#EFF4F7; --radius:14px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; color:var(--text); background:var(--bg); padding-bottom:env(safe-area-inset-bottom); }
  header{ background:var(--navy); color:#fff; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top)); display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  header h1{ font-size:16px; margin:0; flex:1; }
  header small{ display:block; font-weight:400; opacity:.75; font-size:11.5px; }
  header button{ background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px; padding:7px 10px; font-size:13px; }
  .logo-badge{ background:#fff; border-radius:9px; padding:5px 9px; display:inline-flex; }
  .logo-badge img{ height:20px; display:block; }
  .login-logo{ text-align:center; padding:6px 0 10px; } .login-logo img{ height:44px; }
  .sup-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; } .sup-btn{ display:block; width:100%; text-align:left; margin:0; cursor:pointer; font:inherit; color:inherit; } .sup-btn:active{ border-color:var(--teal-dark); }
  main{ max-width:720px; margin:0 auto; padding:14px 14px 80px; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
  label{ display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input,select,textarea{ width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--border); border-radius:10px; background:#fff; color:var(--text); }
  textarea{ min-height:90px; resize:vertical; }
  button.primary{ width:100%; background:var(--teal-dark); color:#fff; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:600; margin-top:16px; }
  button.secondary{ background:#fff; color:var(--teal-dark); border:1px solid var(--teal-dark); border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; }
  button:disabled{ opacity:.5; }
  .row{ display:flex; gap:8px; align-items:center; }
  .grow{ flex:1; }
  .chips{ display:flex; gap:6px; margin-bottom:10px; overflow-x:auto; }
  .chip{ border:1px solid var(--border); background:#fff; border-radius:20px; padding:7px 13px; font-size:13px; white-space:nowrap; }
  .chip.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .ord{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .ord b{ font-size:15px; }
  .ord p{ margin:2px 0 0; font-size:12.5px; color:var(--text-2); }
  .tag{ font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:20px; white-space:nowrap; }
  .tag.p{ background:var(--warning-bg); color:#9A6508; } .tag.a{ background:var(--success-bg); color:var(--success); } .tag.q{ background:var(--danger-bg); color:var(--danger); }
  .opts{ display:flex; flex-direction:column; gap:8px; }
  .opt{ display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:10px; padding:11px 12px; font-size:15px; font-weight:500; margin:0; }
  .opt input{ width:20px; height:20px; padding:0; }
  .opt.sel{ border-color:var(--teal-dark); background:#E4F1F6; }
  .sig{ width:100%; height:170px; border:1px dashed var(--teal-dark); border-radius:10px; background:#fff; touch-action:none; display:block; }
  .photos{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .photos div{ position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:#ddd; }
  .photos img{ width:100%; height:100%; object-fit:cover; }
  .photos button{ position:absolute; top:4px; right:4px; width:26px; height:26px; border-radius:50%; border:0; background:rgba(0,0,0,.65); color:#fff; font-size:15px; }
  .muted{ color:var(--text-2); font-size:13px; }
  .err{ background:var(--danger-bg); color:var(--danger); padding:10px 12px; border-radius:10px; font-size:13.5px; margin-top:12px; }
  .banner{ background:var(--warning-bg); color:#9A6508; padding:9px 14px; font-size:13px; text-align:center; }
  .hidden{ display:none !important; }
  table{ width:100%; border-collapse:collapse; font-size:13px; } th,td{ text-align:left; padding:7px 6px; border-bottom:1px solid var(--border); vertical-align:top; }
  th{ color:var(--text-2); font-weight:600; font-size:12px; }
  .bar{ height:7px; background:var(--border); border-radius:6px; overflow:hidden; margin-top:6px; } .bar i{ display:block; height:100%; background:var(--success); }
  a{ color:var(--teal-dark); }
</style>
</head>
<body>
<header>
  <span class="logo-badge"><img src="logo.png" alt="LECTA"></span>
  <h1 id="title">Auditoría<small id="subtitle"></small></h1>
  <button id="btn-back" class="hidden">← Volver</button>
  <button id="btn-refresh" class="hidden">⟳</button>
  <button id="btn-logout" class="hidden">Salir</button>
</header>
<div id="banner" class="banner hidden"></div>
<main id="app"></main>

<script>
/* ===== CONFIGURACIÓN ===== */
// URL de la Web App de Apps Script (termina en /exec). Ver auditoria/apps-script/Code.gs
const API_URL = "https://script.google.com/macros/s/AKfycbzYbLVLI9jBWc4nYrshWplqYKT-ev9OtFYP_Os8bBkFhhihXeIe3h-RsI76bqRRy9I5YQ/exec";

// Campos que diligencia el supervisor por orden. Editar esta lista para cambiar el formulario.
// type: "radio" (una opción) | "check" (varias) | "text" | "textarea"
const FORM_FIELDS = [
  { id: "resultado",     label: "Resultado de la auditoría", type: "radio", required: true,
    options: ["Conforme", "No conforme", "No se pudo auditar"] },
  { id: "hallazgos",     label: "Hallazgos", type: "check",
    options: ["Trabajo no ejecutado", "Ejecución incompleta", "Dato incorrecto en el acta", "Falta evidencia", "Otro"] },
  { id: "observaciones", label: "Observaciones", type: "textarea" },
  // Datos del usuario que atiende (opcionales). La firma se captura aparte, justo debajo.
  { id: "usuario_nombre",  label: "Usuario que atiende: nombre", type: "text" },
  { id: "usuario_cedula",  label: "Usuario que atiende: cédula", type: "text", inputmode: "numeric" },
  { id: "usuario_celular", label: "Usuario que atiende: celular", type: "text", inputmode: "tel" }
];
const MIN_FOTOS = 0;          // fotos mínimas exigidas (0 = opcionales)
const MAX_FOTOS = 8;
const FOTO_LADO = 1280;       // lado mayor en px tras comprimir
const FOTO_CALIDAD = 0.72;
/* ========================= */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };

let S = { role: null, key: null, supervisor: null, supervisores: [], ordenes: [], auditorias: [], filtro: "Pendiente", q: "", fotos: [], pos: null, adminTab: "critica", segSup: null, segTab: "pend", segOrden: null, segDesde: "", segHasta: "" };

/* ---------- API ---------- */
async function api(body) {
  if (API_URL.indexOf("PEGA_AQUI") === 0) throw new Error("Falta configurar API_URL");
  // text/plain evita el preflight CORS que Apps Script no soporta
  const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ key: S.key }, body)) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "Error del servidor");
  return j;
}

/* ---------- Cola sin conexión (IndexedDB) ---------- */
const idb = () => new Promise((res, rej) => { const r = indexedDB.open("auditoria", 1); r.onupgradeneeded = () => r.result.createObjectStore("q", { keyPath: "id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const qOp = async (mode, fn) => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction("q", mode); const out = fn(t.objectStore("q")); t.oncomplete = () => res(out.result); t.onerror = () => rej(t.error); }); };
const qAll = () => qOp("readonly", s => s.getAll());
const qPut = p => qOp("readwrite", s => s.put(p));
const qDel = id => qOp("readwrite", s => s.delete(id));

async function flushQueue() {
  if (!S.key || !navigator.onLine) return;
  let pend = [];
  try { pend = await qAll(); } catch (e) { return; }
  let sent = 0;
  for (const p of pend) {
    try { await api(Object.assign({ action: "guardar" }, p)); await qDel(p.id); sent++; } catch (e) { break; }
  }
  await updateBanner();
  if (sent && S.role === "supervisor" && $("list")) loadOrdenes();
}
async function updateBanner() {
  let n = 0; try { n = (await qAll()).length; } catch (e) {}
  const b = $("banner");
  b.classList.toggle("hidden", !n);
  b.textContent = n ? n + " auditoría(s) guardada(s) en el teléfono, pendientes de enviar. Se envían solas al volver la señal." : "";
}
window.addEventListener("online", flushQueue);

/* ---------- Sesión ---------- */
function saveSession() { store.set("aud_sess", JSON.stringify({ role: S.role, key: S.key, supervisor: S.supervisor })); }
function logout() { store.del("aud_sess"); S = { role: null, key: null, supervisor: null, supervisores: [], ordenes: [], auditorias: [], filtro: "Pendiente", q: "", fotos: [], pos: null, adminTab: "critica", segSup: null, segTab: "pend", segOrden: null, segDesde: "", segHasta: "" }; S.cr = crNuevo(); renderLogin(); }
$("btn-logout").onclick = logout;
$("btn-refresh").onclick = () => (S.role === "admin" ? loadAdmin() : loadOrdenes());

function chrome(opts) {
  $("subtitle").textContent = opts.sub || "";
  $("btn-back").classList.toggle("hidden", !opts.back);
  $("btn-back").onclick = opts.back || null;
  $("btn-refresh").classList.toggle("hidden", !opts.refresh);
  $("btn-logout").classList.toggle("hidden", !S.key);
}

/* ---------- Login ---------- */
function renderLogin(msg) {
  chrome({ sub: "Inspecciones AAA" });
  $("app").innerHTML = `<div class="card" style="margin-top:8px">
    <div class="login-logo"><img src="logo.png" alt="LECTA"></div>
    <label>Ingresar como</label>
    <select id="lg-role"><option value="supervisor">Supervisor</option><option value="admin">Administrador</option></select>
    <label>Tu clave de acceso</label>
    <input id="lg-key" type="password" autocomplete="current-password" placeholder="Clave">
    <button class="primary" id="lg-go">Entrar</button>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ""}</div>`;
  $("lg-key").onkeydown = e => { if (e.key === "Enter") $("lg-go").click(); };
  $("lg-go").onclick = async () => {
    const key = $("lg-key").value.trim(); if (!key) return;
    $("lg-go").disabled = true;
    try {
      S.key = key; S.role = $("lg-role").value;
      const j = await api({ action: "login" });
      if (j.role !== S.role) throw new Error(S.role === "admin" ? "Esa clave no es de administrador" : "Esa clave es de administrador: elige Administrador");
      S.supervisor = j.supervisor;
      saveSession();
      if (S.role === "admin") loadAdmin(); else loadOrdenes();
    } catch (e) { S.key = null; renderLogin(e.message); }
  };
}

/* ---------- Supervisor: lista de órdenes ---------- */
async function loadOrdenes() {
  chrome({ sub: S.supervisor, refresh: true });
  if (!$("list")) $("app").innerHTML = `<p class="muted">Cargando…</p>`;
  try {
    const j = await api({ action: "ordenes", supervisor: S.supervisor });
    S.ordenes = j.ordenes; S.auditorias = j.auditorias;
    store.set("aud_cache_" + S.supervisor, JSON.stringify(j));
  } catch (e) {
    const c = store.get("aud_cache_" + S.supervisor);
    if (c) { const j = JSON.parse(c); S.ordenes = j.ordenes; S.auditorias = j.auditorias; }
    else { $("app").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  }
  const pend = await qAll().catch(() => []);
  const enCola = new Set(pend.map(p => String(p.orden)));
  S.ordenes.forEach(o => { if (enCola.has(String(o["Orden"]))) o.Estado = "Por enviar"; });
  renderLista();
  updateBanner(); flushQueue();
}
function renderLista() {
  const cnt = e => S.ordenes.filter(o => e === "Todas" || o.Estado === e).length;
  const filtros = ["Pendiente", "Por enviar", "Auditada", "Todas"];
  const q = S.q.toLowerCase();
  const items = S.ordenes.filter(o => (S.filtro === "Todas" || o.Estado === S.filtro) && (!q || (o["Orden"] + " " + o["Dirección"] + " " + o["Tipo de trabajo"]).toLowerCase().includes(q)));
  $("app").innerHTML = `
    <div class="chips">${filtros.map(f => `<button class="chip ${f === S.filtro ? "on" : ""}" data-f="${f}">${f} (${cnt(f)})</button>`).join("")}</div>
    <input id="q" type="search" placeholder="Buscar orden o dirección" value="${esc(S.q)}" style="margin-bottom:10px">
    <div id="list">${items.length ? items.map(o => `<div class="card ord" data-o="${esc(o["Orden"])}">
      <div class="grow"><b>${esc(o["Orden"])}</b><p>${esc(o["Dirección"] || "Sin dirección")}${o["Tipo de trabajo"] ? " · " + esc(o["Tipo de trabajo"]) : ""}</p></div>
      <span class="tag ${o.Estado === "Auditada" ? "a" : o.Estado === "Por enviar" ? "q" : "p"}">${esc(o.Estado)}</span></div>`).join("") : '<p class="muted">No hay órdenes en esta vista.</p>'}</div>`;
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { S.filtro = b.dataset.f; renderLista(); });
  $("q").oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; renderLista(); $("q").focus(); $("q").setSelectionRange(pos, pos); };
  document.querySelectorAll(".ord").forEach(c => c.onclick = () => renderForm(c.dataset.o));
}

/* ---------- Supervisor: formulario de auditoría ---------- */
function renderForm(orden) {
  const o = S.ordenes.find(x => String(x["Orden"]) === String(orden));
  const hecha = S.auditorias.find(a => String(a["Orden"]) === String(orden));
  S.fotos = []; S.pos = null;
  chrome({ sub: "Orden " + orden, back: () => renderLista() });
  let extra = {}; try { extra = JSON.parse(o["Detalle"] || "{}"); } catch (e) {}
  const info = [["Dirección", o["Dirección"]], ["Tipo de trabajo", o["Tipo de trabajo"]], ["Inspector", o["Inspector"]], ["Observación", o["Observación"]]].concat(Object.entries(extra)).filter(x => x[1]);
  let prev = {}; if (hecha) try { prev = JSON.parse(hecha["Datos"] || "{}"); } catch (e) {}

  $("app").innerHTML = `
    <div class="card"><b style="font-size:17px">${esc(orden)}</b>
      ${info.map(([k, v]) => `<p class="muted" style="margin:4px 0"><b>${esc(k)}:</b> ${valHtml(v)}</p>`).join("")}</div>
    ${hecha ? `<div class="card"><span class="tag a">Auditada</span> <span class="muted">${esc(prev.resultado || "")}. Si guardas de nuevo se registra otra auditoría.</span></div>` : ""}
    <form id="f" class="card" onsubmit="return false">
      ${FORM_FIELDS.map(fieldHtml).join("")}
      <label>Firma del usuario que atiende (opcional)</label>
      <canvas id="sig" class="sig"></canvas>
      <div class="row"><span class="muted grow">Firma con el dedo o el lápiz</span><button type="button" class="secondary" id="sig-clear">Borrar firma</button></div>
      <label>Fotos (${MIN_FOTOS ? "mínimo " + MIN_FOTOS + ", " : ""}máximo ${MAX_FOTOS})</label>
      <div class="row"><button type="button" class="secondary grow" id="ph-cam">📷 Tomar foto</button><button type="button" class="secondary grow" id="ph-gal">🖼 Galería</button></div>
      <input id="ph-in-cam" type="file" accept="image/*" capture="environment" class="hidden">
      <input id="ph-in-gal" type="file" accept="image/*" multiple class="hidden">
      <div class="photos" id="photos"></div>
      <label>Ubicación</label>
      <div class="row"><button type="button" class="secondary" id="gps">📍 Registrar ubicación</button><span class="muted" id="gps-st">Sin registrar</span></div>
      <div id="f-err"></div>
      <button class="primary" id="save">Guardar auditoría</button>
    </form>`;
  document.querySelectorAll(".opt input").forEach(i => i.onchange = () => document.querySelectorAll(".opt").forEach(l => l.classList.toggle("sel", l.querySelector("input").checked)));
  $("ph-cam").onclick = () => $("ph-in-cam").click();
  $("ph-gal").onclick = () => $("ph-in-gal").click();
  $("ph-in-cam").onchange = $("ph-in-gal").onchange = async e => { const fs = [...e.target.files]; e.target.value = ""; for (const f of fs) { if (S.fotos.length >= MAX_FOTOS) break; try { S.fotos.push(await compress(f)); } catch (x) {} } renderFotos(); };
  $("gps").onclick = getGps;
  initSig();
  getGps();
  $("save").onclick = () => save(orden);
}
function fieldHtml(f) {
  if (f.type === "radio" || f.type === "check")
    return `<label>${esc(f.label)}${f.required ? " *" : ""}</label><div class="opts">${f.options.map(op => `<label class="opt"><input type="${f.type === "radio" ? "radio" : "checkbox"}" name="${f.id}" value="${esc(op)}"> ${esc(op)}</label>`).join("")}</div>`;
  if (f.type === "textarea") return `<label>${esc(f.label)}${f.required ? " *" : ""}</label><textarea name="${f.id}"></textarea>`;
  return `<label>${esc(f.label)}${f.required ? " *" : ""}</label><input name="${f.id}" type="text" inputmode="${f.inputmode || "text"}" autocomplete="off">`;
}
function renderFotos() {
  $("photos").innerHTML = S.fotos.map((f, i) => `<div><img src="data:image/jpeg;base64,${f.data}"><button type="button" data-i="${i}">×</button></div>`).join("");
  document.querySelectorAll("#photos button").forEach(b => b.onclick = () => { S.fotos.splice(+b.dataset.i, 1); renderFotos(); });
}
function compress(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, FOTO_LADO / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res({ name: file.name, data: c.toDataURL("image/jpeg", FOTO_CALIDAD).split(",")[1] });
    };
    img.onerror = rej; img.src = url;
  });
}
// Lienzo de firma: funciona con dedo, lápiz o mouse (pointer events); se guarda como PNG con fondo blanco
function initSig() {
  const c = $("sig"), b = c.getBoundingClientRect(), k = window.devicePixelRatio || 1, x = c.getContext("2d");
  c.width = Math.round(b.width * k); c.height = Math.round(b.height * k);
  x.scale(k, k); x.lineWidth = 2.2; x.lineCap = x.lineJoin = "round"; x.strokeStyle = "#0B3D5C";
  const blanco = () => { x.fillStyle = "#fff"; x.fillRect(0, 0, b.width, b.height); };
  blanco(); S.firma = false;
  let ultimo = null;
  const pt = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const trazo = (a, p) => { x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(p.x, p.y); x.stroke(); S.firma = true; };
  c.onpointerdown = e => { e.preventDefault(); c.setPointerCapture(e.pointerId); ultimo = pt(e); trazo(ultimo, { x: ultimo.x + 0.1, y: ultimo.y }); };
  c.onpointermove = e => { if (!ultimo) return; const p = pt(e); trazo(ultimo, p); ultimo = p; };
  c.onpointerup = c.onpointercancel = () => { ultimo = null; };
  $("sig-clear").onclick = () => { blanco(); S.firma = false; };
}
function getGps() {
  if (!navigator.geolocation) return;
  $("gps-st").textContent = "Buscando…";
  navigator.geolocation.getCurrentPosition(p => { S.pos = { lat: p.coords.latitude, lng: p.coords.longitude }; $("gps-st").textContent = "✓ ±" + Math.round(p.coords.accuracy) + " m"; }, () => { $("gps-st").textContent = "No disponible"; }, { enableHighAccuracy: true, timeout: 15000 });
}
async function save(orden) {
  const fd = new FormData($("f")), datos = {}, errs = [];
  FORM_FIELDS.forEach(f => {
    const v = f.type === "check" ? fd.getAll(f.id) : (fd.get(f.id) || "").toString().trim();
    datos[f.id] = v;
    if (f.required && (Array.isArray(v) ? !v.length : !v)) errs.push("Falta: " + f.label);
  });
  if (S.fotos.length < MIN_FOTOS) errs.push("Adjunta al menos " + MIN_FOTOS + " foto(s)");
  if (errs.length) { $("f-err").innerHTML = `<div class="err">${errs.map(esc).join("<br>")}</div>`; return; }
  const payload = { id: "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), orden: String(orden), supervisor: S.supervisor, datos, lat: S.pos && S.pos.lat, lng: S.pos && S.pos.lng, fotos: S.fotos, firma: S.firma ? $("sig").toDataURL("image/png").split(",")[1] : "" };
  $("save").disabled = true; $("save").textContent = "Guardando…";

let gvN = 0;
function gviz(tq, hoja) {
  return new Promise((res, rej) => {
    const cb = "gv_cb" + (++gvN), sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); };
    window[cb] = r => { done(); if (r.status !== "ok") return rej(new Error((r.errors && r.errors[0] && r.errors[0].detailed_message) || "Error leyendo la hoja de Crítica")); res(r.table); };
    sc.onerror = () => { done(); rej(new Error("No se pudo leer la hoja de Crítica")); };
    sc.src = "https://docs.google.com/spreadsheets/d/" + CRITICA_SHEET_ID + "/gviz/tq?tqx=out:json;responseHandler:" + cb + "&" + (hoja ? "sheet=" + encodeURIComponent(hoja) : "gid=" + CRITICA_GID) + "&tq=" + encodeURIComponent(tq) + "&_=" + Date.now();
    document.head.appendChild(sc);
  });
}
const cv = c => (c == null || c.v == null ? "" : c.v);
function gvIso(c) { const m = /^Date\((\d+),(\d+),(\d+)/.exec(String(cv(c))); return m ? m[1] + "-" + String(+m[2] + 1).padStart(2, "0") + "-" + m[3].padStart(2, "0") : ""; }
const fmtFecha = iso => iso ? iso.split("-").reverse().join("/") : "";
const crWhere = () => "where J >= date '" + S.cr.desde + "' and J <= date '" + S.cr.hasta + "'" + (S.cr.insp ? ' and L = "' + S.cr.insp.replace(/"/g, "") + '"' : "");
// Open guarda las coordenadas con puntos de miles ("-7.479.699.903" = -74.79699903): se recoloca el decimal tras 2 dígitos enteros
function coord(v) { const s = String(v == null ? "" : v), d = s.replace(/\D/g, ""); if (d.length < 3) return null; return (s.trim().startsWith("-") ? -1 : 1) * (+d / Math.pow(10, d.length - 2)); }

async function crCargarInspectores() {

    if (c.desde !== desde || c.hasta !== hasta) return;   // el usuario ya cambió las fechas
    c.inspList = t.rows.map(r => ({ n: String(cv(r.c[0])), c: cv(r.c[1]) })).filter(i => i.n);

// Carga AuditoríaOpen (cruce por orden) y fija el rango de fechas a los días que se pueden auditar
async function crIniciar() {
  const c = S.cr;
  if (c.desde || c.iniciando) return;
  c.iniciando = true;
  try {
    const [rng, t] = await Promise.all([gviz("select min(J), max(J), count(E)", OPEN_SHEET), gviz("select E, C, AQ, AS, AY, AZ limit 30000", OPEN_SHEET)]);
    const map = {};
    t.rows.forEach(r => { const x = r.c.map(cv), o = String(x[0]).replace(/\.0$/, ""); if (!o) return; const la = coord(x[5]), lo = coord(x[4]); map[o] = { dir: x[1], municipio: x[2], barrio: x[3], mapa: la != null && lo != null ? "https://www.google.com/maps?q=" + la.toFixed(6) + "," + lo.toFixed(6) : "" }; });
    c.open = { map, n: Object.keys(map).length, min: gvIso(rng.rows[0].c[0]), max: gvIso(rng.rows[0].c[1]) };
    c.desde = c.open.min; c.hasta = c.open.max;
  } catch (e) {
    c.open = null; c.msg = errMsg("No se pudo leer la hoja " + OPEN_SHEET + " (" + e.message + "). Se muestran todas las órdenes de Crítica, sin dirección.");
    try { const t = await gviz("select max(J)"); c.hasta = c.desde = gvIso(t.rows[0].c[0]); } catch (e2) { c.inspList = []; c.iniciando = false; renderAdmin(); return; }
  }

  renderAdmin(); crCargarInspectores();
}

      <p class="muted" style="margin:8px 0 0">Toca un supervisor para ver sus órdenes pendientes y ejecutadas. Eliminar quita de la lista las órdenes ya diligenciadas; el historial de auditorías y las fotos se conservan. Descarga el Excel antes.</p></div>
    <div class="sup-grid">${names.map(n => { const d = by[n], t = d.pend.length + d.ejec.length;
      return `<button class="card sup-btn" data-sup="${esc(n)}"><div class="row"><b class="grow">${esc(n)}</b><span class="muted">${d.ejec.length}/${t}</span></div>${segBar(d.ejec.length, t)}<div class="muted" style="margin-top:6px">${d.pend.length} pendientes · ${d.ejec.length} ejecutadas</div></button>`; }).join("") || '<p class="muted">Aún no hay órdenes cargadas.</p>'}</div>`;
}

function segDetalle(nombre, d) {
  const ejec = S.segTab === "ejec", lista = ejec ? d.ejec : d.pend;
  const sel = S.segOrden && lista.find(x => String(x["Orden"]) === S.segOrden);
  return `<div class="row" style="margin-bottom:10px"><button class="secondary" id="sg-back">← Supervisores</button><b class="grow" style="text-align:right">${esc(nombre)}</b></div>
    <div class="chips"><button class="chip ${ejec ? "" : "on"}" data-st="pend">Pendientes (${d.pend.length})</button><button class="chip ${ejec ? "on" : ""}" data-st="ejec">Ejecutadas (${d.ejec.length})</button></div>
    <div class="card" style="padding:10px">${segFiltroHtml([d])}</div>
    <button class="secondary" id="sg-xls" style="width:100%;margin-bottom:10px" ${lista.length ? "" : "disabled"}>⬇ Descargar ${ejec ? "ejecutadas" : "pendientes"} (Excel)</button>
    <button class="secondary" id="sg-dellist" style="width:100%;margin-bottom:10px;color:var(--danger);border-color:var(--danger)" ${lista.length ? "" : "disabled"}>🗑 Eliminar toda esta lista (${lista.length})</button>
    ${sel ? segOrdenHtml(sel, ejec) : ""}
    ${lista.map(x => { const o = String(x["Orden"]), r = ejec ? datosAud(x) : null, dir = x["Dirección"] || (ejec ? (ordenPorId(o) || {})["Dirección"] : "");
      return `<div class="card ord" data-o="${esc(o)}" style="${o === S.segOrden ? "border-color:var(--teal-dark)" : ""}"><div class="grow"><b>${esc(o)}</b><p>${esc(dir || "Sin dirección")}${ejec && x["Fecha"] ? " · " + new Date(x["Fecha"]).toLocaleString("es-CO") : ""}</p></div>${ejec ? `<span class="tag ${/^no conforme/i.test(r.resultado || "") ? "q" : "a"}">${esc(r.resultado || "Auditada")}</span>` : '<span class="tag p">Pendiente</span>'}</div>`; }).join("") || '<p class="muted">No hay órdenes en esta lista.</p>'}`;
}
const ordenPorId = id => S.ordenes.find(o => String(o["Orden"]) === String(id));

// Detalle de una orden: si está ejecutada, sus resultados; si no, la información que se le asignó
function segOrdenHtml(x, ejec) {
  const o = ejec ? (ordenPorId(x["Orden"]) || {}) : x, det = Object.assign({}, detalleOrden(o), ejec ? detalleOrden(x) : {});
  const info = [["Dirección", x["Dirección"] || o["Dirección"]], ["Tipo de trabajo", x["Tipo de trabajo"] || o["Tipo de trabajo"]], ["Inspector", x["Inspector"] || o["Inspector"]], ["Indicación", o["Observación"]]].concat(Object.entries(det)).filter(p => p[1]);
  let res = "";
  if (ejec) {
    const d = datosAud(x), fotos = fotosAud(x);
    res = `<hr style="border:0;border-top:1px solid var(--border);margin:10px 0"><b>Resultados de la auditoría</b>
      <p class="muted" style="margin:4px 0">${esc(x["Supervisor"])} · ${x["Fecha"] ? new Date(x["Fecha"]).toLocaleString("es-CO") : ""}</p>
      ${FORM_FIELDS.map(f => { const v = [].concat(d[f.id] == null ? "" : d[f.id]).join(", "); return v ? `<p style="margin:6px 0"><b>${esc(f.label)}:</b> ${esc(v)}</p>` : ""; }).join("")}
      ${x["Latitud"] ? `<p style="margin:6px 0"><b>Ubicación:</b> <a href="https://www.google.com/maps?q=${esc(x["Latitud"])},${esc(x["Longitud"])}" target="_blank" rel="noopener">Ver donde se auditó</a></p>` : ""}
      ${x["Firma"] ? `<p style="margin:6px 0"><b>Firma del usuario:</b> <a href="${esc(x["Firma"])}" target="_blank" rel="noopener">Ver firma</a></p>` : ""}
      <p style="margin:6px 0"><b>Fotos:</b> ${fotos.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">Foto ${i + 1}</a>`).join(" · ") || "sin fotos"}</p>`;
  }
  return `<div class="card" style="border-color:var(--teal-dark)"><div class="row"><b class="grow" style="font-size:16px">Orden ${esc(x["Orden"])}</b><button class="secondary" id="sg-del" style="color:var(--danger);border-color:var(--danger)">Eliminar</button><button class="secondary" id="sg-cerrar">Cerrar</button></div>
    ${info.map(([k, v]) => `<p class="muted" style="margin:4px 0"><b>${esc(k)}:</b> ${valHtml(v)}</p>`).join("")}${res}</div>`;
}

function bindSeg() {
  document.querySelectorAll("[data-sup]").forEach(b => b.onclick = () => { S.segSup = b.dataset.sup; S.segTab = "pend"; S.segOrden = null; renderAdmin(); });
  if ($("sg-fd")) { $("sg-fd").onchange = e => { S.segDesde = e.target.value; renderAdmin(); }; $("sg-fh").onchange = e => { S.segHasta = e.target.value; renderAdmin(); }; }
  if ($("sg-fx")) $("sg-fx").onclick = e => { e.preventDefault(); S.segDesde = S.segHasta = ""; renderAdmin(); };
  if ($("vaciar")) $("vaciar").onclick = async () => {
    if (prompt("Se borrarán TODAS las órdenes y auditorías cargadas y las fotos (se conservan los supervisores y sus claves). Descarga el Excel antes. Escribe BORRAR para confirmar.") !== "BORRAR") return;
    try { const j = await api({ action: "vaciarTodo" }); await refreshAdmin(); S.segSup = null; renderAdmin(okMsg(j.filas + " filas eliminadas. Todo quedó en cero.")); } catch (e) { renderAdmin(errMsg(e.message)); }
  };
  if ($("sg-del")) $("sg-del").onclick = () => borrarOrdenes([S.segOrden], "¿Eliminar la orden " + S.segOrden + " y su auditoría?" + AVISO_FOTOS);
  if ($("sg-dellist")) $("sg-dellist").onclick = () => { const d = segDatos()[S.segSup], l = (S.segTab === "ejec" ? d.ejec : d.pend).map(x => String(x["Orden"])); borrarOrdenes(l, "¿Eliminar las " + l.length + " órdenes de esta lista y sus auditorías?" + AVISO_FOTOS); };
  if ($("dl-all")) { $("dl-all").onclick = () => descargarExcel("auditoria_" + hoy(), segHojas(Object.values(segDatos()))); $("del-aud").onclick = eliminarAuditadas; }
  if ($("sg-back")) $("sg-back").onclick = () => { S.segSup = null; S.segOrden = null; renderAdmin(); };
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { S.segTab = b.dataset.st; S.segOrden = null; renderAdmin(); });
  document.querySelectorAll(".ord[data-o]").forEach(c => c.onclick = () => { S.segOrden = S.segOrden === c.dataset.o ? null : c.dataset.o; renderAdmin(); });
  if ($("sg-cerrar")) $("sg-cerrar").onclick = () => { S.segOrden = null; renderAdmin(); };
  if ($("sg-xls")) $("sg-xls").onclick = () => {
    const d = segDatos()[S.segSup], ejec = S.segTab === "ejec", h = segHojas([d]).find(x => x.name === (ejec ? "Ejecutadas" : "Pendientes"));
    descargarExcel((ejec ? "ejecutadas_" : "pendientes_") + S.segSup.replace(/[^\wÁÉÍÓÚÑáéíóúñ]+/g, "_") + "_" + hoy(), [h]);
  };
}
const hoy = () => new Date().toISOString().slice(0, 10);

// Filtro de fechas para la descarga: fecha de auditoría (ejecutadas) o de carga (pendientes)
const diaLocal = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toLocaleDateString("en-CA") : ""; };
function enRango(iso) {
  if (!S.segDesde && !S.segHasta) return true;
  const d = diaLocal(iso);
  return !!d && (!S.segDesde || d >= S.segDesde) && (!S.segHasta || d <= S.segHasta);
}
function segFiltroHtml(grupos) {
  const p = [].concat(...grupos.map(g => g.pend)).filter(o => enRango(o["Cargada el"])).length, e = [].concat(...grupos.map(g => g.ejec)).filter(a => enRango(a["Fecha"])).length;
  return `<div style="margin-top:12px"><b style="font-size:13px">Fechas para descargar</b>
    <div class="row"><div class="grow"><label style="margin-top:6px">Desde</label><input type="date" id="sg-fd" value="${S.segDesde}"></div><div class="grow"><label style="margin-top:6px">Hasta</label><input type="date" id="sg-fh" value="${S.segHasta}"></div></div>
    <p class="muted" style="margin:6px 0 0">${S.segDesde || S.segHasta ? `Se descargan ${p} pendientes y ${e} ejecutadas en ese rango (por fecha de carga y de auditoría).` : `Sin fechas se descarga todo: ${p} pendientes y ${e} ejecutadas.`} ${S.segDesde || S.segHasta ? '<a href="#" id="sg-fx">Quitar filtro</a>' : ""}</p></div>`;
}
async function borrarOrdenes(ordenes, aviso) {
  if (!ordenes.length || !confirm(aviso)) return;
  try { const j = await api({ action: "eliminarOrdenes", ordenes }); await refreshAdmin(); S.segOrden = null; renderAdmin(okMsg(`${j.ordenes} órdenes y ${j.auditorias} auditorías eliminadas.`)); }
  catch (e) { renderAdmin(errMsg(e.message)); }
}
const AVISO_FOTOS = " Las fotos de esas órdenes se mandan a la papelera de Drive.";

// Hojas Pendientes y Ejecutadas con las columnas extra (municipio, barrio, etc.) que traigan las órdenes
function segHojas(grupos) {
  const pend = [].concat(...grupos.map(g => g.pend)).filter(o => enRango(o["Cargada el"])), ejec = [].concat(...grupos.map(g => g.ejec)).filter(a => enRango(a["Fecha"]));
  const extra = list => { const k = []; list.forEach(x => Object.keys(x._det).forEach(n => { if (k.indexOf(n) < 0) k.push(n); })); return k; };
  const P = pend.map(o => ({ o, _det: detalleOrden(o) })), E = ejec.map(a => ({ a, o: ordenPorId(a["Orden"]) || {}, _det: Object.assign({}, detalleOrden(ordenPorId(a["Orden"])), detalleOrden(a)) }));
  const kp = extra(P), ke = extra(E);
  return [
    { name: "Pendientes", head: ["Orden", "Supervisor", "Inspector", "Dirección", "Tipo de trabajo", "Indicación"].concat(kp),
      rows: P.map(({ o, _det }) => [o["Orden"], o["Supervisor"], o["Inspector"], o["Dirección"], o["Tipo de trabajo"], o["Observación"]].concat(kp.map(k => _det[k] || ""))) },
    { name: "Ejecutadas", head: ["Orden", "Supervisor", "Fecha auditoría", "Dirección", "Tipo de trabajo", "Inspector"].concat(FORM_FIELDS.map(f => f.label), ["Latitud", "Longitud", "Fotos", "Firma"], ke),
      rows: E.map(({ a, o, _det }) => { const d = datosAud(a);
        return [a["Orden"], a["Supervisor"], a["Fecha"] ? new Date(a["Fecha"]).toLocaleString("es-CO") : "", a["Dirección"] || o["Dirección"], a["Tipo de trabajo"] || o["Tipo de trabajo"], a["Inspector"] || o["Inspector"]]
          .concat(FORM_FIELDS.map(f => [].concat(d[f.id] == null ? "" : d[f.id]).join("; ")), [a["Latitud"], a["Longitud"], fotosAud(a).join(" "), a["Firma"]], ke.map(k => _det[k] || "")); }) }
  ];
}

// Excel real (.xlsx) con SheetJS, cargado solo al descargar; si no carga, baja un CSV compatible con Excel
let xlsxP = null;
const loadXlsx = () => window.XLSX ? Promise.resolve() : (xlsxP = xlsxP || new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = res; s.onerror = () => rej(new Error("no cargó")); document.head.appendChild(s); }));
function bajar(nombre, blob) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); }
async function descargarExcel(nombre, hojas) {
  const txt = v => (v == null ? "" : String(v));
  try {
    await loadXlsx();
    const wb = XLSX.utils.book_new();
    hojas.forEach(h => { const ws = XLSX.utils.aoa_to_sheet([h.head].concat(h.rows.map(r => r.map(txt)))); ws["!cols"] = h.head.map(x => ({ wch: Math.max(12, Math.min(40, x.length + 4)) })); XLSX.utils.book_append_sheet(wb, ws, h.name.slice(0, 31)); });
    XLSX.writeFile(wb, nombre + ".xlsx");
  } catch (e) {
    const cell = v => '"' + txt(v).replace(/"/g, '""') + '"';
    hojas.forEach(h => bajar(nombre + (hojas.length > 1 ? "_" + h.name : "") + ".csv", new Blob(["﻿" + [h.head].concat(h.rows).map(r => r.map(cell).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" })));
  }
}
async function eliminarAuditadas() {
  const n = S.ordenes.filter(o => o.Estado === "Auditada").length;
  if (!n || !confirm("Se eliminarán " + n + " órdenes ya diligenciadas de la lista. El historial de auditorías se conserva. ¿Continuar?")) return;
  $("del-aud").disabled = true;
  try { const j = await api({ action: "eliminarAuditadas" }); await refreshAdmin(); renderAdmin(okMsg(j.eliminadas + " órdenes eliminadas.")); }
  catch (e) { renderAdmin(errMsg(e.message)); }
}

/* --- Supervisores y claves --- */
const genClave = () => { const c = "abcdefghjkmnpqrstuvwxyz23456789"; let s = ""; for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };
function adminSup() {
  return `<div class="card"><p class="muted" style="margin-top:0">Cada supervisor entra con su propia clave y solo ve sus órdenes. El nombre debe ser idéntico al de la columna Supervisor de las órdenes.</p>
    ${S.supervisores.map((s, i) => `<div class="card" style="background:var(--bg)"><div class="row"><b class="grow">${esc(s.Supervisor)}</b>${s.Clave ? "" : '<span class="tag q">Sin clave</span>'}</div>
      <div class="row" style="margin-top:8px"><input data-k="${i}" value="${esc(s.Clave)}" placeholder="Clave (mín. 4)" class="grow"><button class="secondary" data-g="${i}" title="Generar">🎲</button><button class="secondary" data-s="${i}">Guardar</button></div>
      ${s.Clave ? `<button class="secondary" data-d="${i}" style="margin-top:8px;color:var(--danger);border-color:var(--danger)">Quitar acceso</button>` : ""}</div>`).join("") || '<p class="muted">Aún no hay supervisores. Carga órdenes o agrega uno abajo.</p>'}</div>
    <div class="card"><b>Agregar supervisor</b><label>Nombre</label><input id="ns-n"><label>Clave</label><div class="row"><input id="ns-k" class="grow"><button class="secondary" id="ns-g">🎲</button></div><button class="primary" id="ns-go">Agregar</button></div>`;
}
function bindSup() {
  const guardar = async (nombre, clave) => { try { await api({ action: "guardarSupervisor", nombre, clave }); await refreshAdmin(); renderAdmin(okMsg("Clave guardada para " + esc(nombre) + ".")); } catch (e) { renderAdmin(errMsg(e.message)); } };
  document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { document.querySelector(`[data-k="${b.dataset.g}"]`).value = genClave(); });
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => guardar(S.supervisores[+b.dataset.s].Supervisor, document.querySelector(`[data-k="${b.dataset.s}"]`).value));
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => { const n = S.supervisores[+b.dataset.d].Supervisor; if (!confirm("¿Quitar el acceso de " + n + "?")) return; try { await api({ action: "eliminarSupervisor", nombre: n }); await refreshAdmin(); renderAdmin(okMsg("Acceso quitado.")); } catch (e) { renderAdmin(errMsg(e.message)); } });
  $("ns-g").onclick = () => { $("ns-k").value = genClave(); };
  $("ns-go").onclick = () => guardar($("ns-n").value.trim(), $("ns-k").value);
}

/* ---------- Inicio ---------- */
(function init() {
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {}));
  try { const s = JSON.parse(store.get("aud_sess") || "null"); if (s && s.key) { S.role = s.role; S.key = s.key; S.supervisor = s.supervisor; return S.role === "admin" ? loadAdmin() : S.supervisor ? loadOrdenes() : renderLogin(); } } catch (e) {}
  renderLogin();
})();
</script>
</body>
</html>
